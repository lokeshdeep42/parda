name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LLAMA_CPP_COMMIT: 84e76d8a23162eca70490da131945ebec1f09bf4
    steps:
      - uses: actions/checkout@v4
      - name: Fetch llama.cpp (pinned, built from source by the NDK)
        run: |
          git init -q ../llama.cpp
          git -C ../llama.cpp fetch -q --depth 1 https://github.com/ggml-org/llama.cpp "$LLAMA_CPP_COMMIT"
          git -C ../llama.cpp checkout -q FETCH_HEAD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests
        run: ./gradlew :core:test
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - name: Verify the APK declares no network permission
        run: |
          AAPT2=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          if $AAPT2 dump permissions app/build/outputs/apk/debug/app-debug.apk | grep -E "INTERNET|ACCESS_NETWORK_STATE"; then
            echo "Network permission found in APK" && exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: parda-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
